<!DOCTYPE html>
<html lang="es">
<!--especificamos el idioma español-->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Indicamos un título para la página -->
    <title>Formulario de inicio de sesión</title>
</head>

<body>
    <!--metemos el h1 en un header-->
    <header>
        <h1>Formulario de acceso</h1>
    </header>
    <!--metemos el contenido principal en un main-->
    <main>
        <form action="">
            <!-- metemos el label y el input en un p para agruparlos en una línea-->
            <p>
                <label for="username">Nombre de usuario:</label>
                <!-- añadimos el atributo placeholder por accesibilidad -->
                <input type="text" id="username" name="username" placeholder="Ana">
            </p>
            <p>
                <label for="password">Clave:</label>
                <!-- añadimos el atributo placeholder por accesibilidad y title -->
                <input type="password" name="passwd" id="passwd"
                    title="Contraseña. Mínimo 6 caracteres: números, letras y símbolos" placeholder="Abc123.">
            </p>

            <button type="submit">Enviar</button>
            <button type="reset">Borrar</button>
        </form>
</body>

</html>
