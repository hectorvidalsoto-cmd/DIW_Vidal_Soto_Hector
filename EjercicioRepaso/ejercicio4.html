<!-- Ejercicio 4
Confeccionar un formulario que solicite el ingreso del nombre de un usuario y su clave. Mostrar asteriscos
donde se ingresa la clave. Dispón dos botones, uno para el envío de datos al servidor y otro para borrar el
contenido de todos los controles (editores de texto) que contiene el formulario.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <label for="username">Nombre de usuario:</label>
        <input type="text" id="username" name="username" required><br><br>

        <label for="password">Clave:</label>
        <input type="password" id="password" name="password" required><br><br>

        <button type="submit">Enviar</button>
        <button type="reset">Borrar</button>
    </form>
</body>
</html>
