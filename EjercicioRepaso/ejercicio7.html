<!--Ejercicio 7
Confeccionar un formulario que solicite los datos personales de una persona y los datos del lugar
donde trabaja, cada grupo de datos disponerlos agrupados con su correspondiente legend.
Debes tener una campo para la fecha de nacimiento.
Usa una lista con agrupación de de opciones para el país de nacimiento.-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <fieldset>
            <legend>Datos Personales</legend>
            <label for="name">Nombre:</label>
            <input type="text" id="name" name="name" required><br><br>

            <label for="birthdate">Fecha de Nacimiento:</label>
            <input type="date" id="birthdate" name="birthdate" required><br><br>
        </fieldset>

        <fieldset>
            <legend>Datos del Lugar donde Trabaja</legend>
            <label for="company">Nombre de la Empresa:</label>
            <input type="text" id="company" name="company" required><br><br>

            <label for="country">País de Nacimiento:</label>
            <select id="country" name="country" required>
                <option value="">Selecciona un país</option>
                <option value="es">España</option>
                <option value="mx">México</option>
                <option value="ar">Argentina</option>
                <option value="cl">Chile</option>
                <option value="co">Colombia</option>
            </select><br><br>
        </fieldset>

        <button type="submit">Enviar</button>
    </form>
</body>
</html>
