<!DOCTYPE html>
<html lang="es">
<!--especificamos el idioma español-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Indicamos un título para la página -->
    <title>Ejercicio 1 - Lista de lenguajes de programación</title>
</head>

<body>
    <!--metemos el h1 en un header-->
    <header>
        <h1>Lista de lenguajes de programacion</h1>
    </header>
    <!--metemos el contenido principal en un main
    -->
    <main>
        <!--Falta el listado de lenguajes de programación-->
        <section>
            <h2>Lista de lenguajes de programación</h2>
            <ul>
                <li>C</li>
                <li>Java</li>
                <li>Python</li>
                <li>PHP</li>
                <li>Ruby</li>
                <li>Visual Basic</li>
            </ul>
        </section>
        <!--metemos la lista desordenada en un section con un título
        -->
        <section>
            <h2>Páginas interesantes sobre lenguajes de programación:</h2>
            <ul>
                <li><a href="https://es.python.org/aprende-python/">Python</a></li>
                <li><a href="https://lenguajejs.com/javascript/">JavaScript</a></li>
                <li><a href="https://plataforma.josedomingo.org/pledin/cursos/curso_cpp1/curso/u03/">C++</a></li>
                <li><a href="https://www.edx.org/es/aprende/lenguaje-typescript">TypeScript</a></li>
                <li><a href="https://rust-lang.org/es/">Rust</a></li>
            </ul>
        </section>
    </main>
</body>

</html>
